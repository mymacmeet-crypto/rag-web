# ---------------------------------------------------------------- developer

- question: What does AEM_BACKEND_FETCH_FAILED mean?
  expect_urls: ["https://www.aem.live/developer/admin-errors"]
  note: exact identifier - this is the case BM25 exists to catch, not vectors

- question: My preview says the file cannot be found, what is wrong?
  expect_urls: ["https://www.aem.live/developer/admin-errors"]

- question: Are there ready-made components I can start from?
  expect_urls: ["https://www.aem.live/developer/block-collection"]

- question: How do I turn a spreadsheet into JSON I can query?
  expect_urls: ["https://www.aem.live/developer/spreadsheets"]

- question: How does the search index get built?

- question: How do I get a sitemap generated?
  expect_urls: ["https://www.aem.live/developer/sitemap"]

# ------------------------------------------------- must be declined, not guessed
#
# Nothing in this corpus answers these. A model that produces a confident
# answer here is the failure mode that matters most, because it is invisible.

- question: What is the capital city of Australia?
  unanswerable: true
  note: general knowledge - must not answer from training

- question: How do I configure a Kubernetes ingress controller for this?
  unanswerable: true
  note: plausible-sounding but genuinely absent - the dangerous kind

- question: What is the exact SLA uptime percentage guaranteed in the contract?
  unanswerable: true
  note: sounds like it should be documented; it is not

- question: Who is the current CEO of Adobe?
  unanswerable: true
  note: about the vendor, not the product

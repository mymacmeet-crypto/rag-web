# The golden set - the single thing that separates this from a demo.
#
# Rules for adding to it:
#
#   1. Write the question the way someone would actually type it. Copying a
#      heading verbatim makes recall trivially 100% and the metric meaningless,
#      so these are deliberately paraphrases.
#   2. `expect_urls` lists every page that legitimately answers it. Matching
#      ignores the anchor - recall asks whether the right page was found.
#   3. Include unanswerable questions. A small local model's failure mode is
#      inventing a plausible answer, and this is the only thing that catches it.
#
# Run:  askdocs eval            (retrieval only - fast)
#       askdocs eval --refusal  (also checks it declines - slow, needs the chat model)

# ---------------------------------------------------------------- concepts

- question: Does it rebuild the whole site when I change one page?
  expect_urls: ["https://www.aem.live/docs/faq"]
  note: paraphrase of the SSG question - never says "static site generator"

- question: Why is it so quick to load?
  expect_urls: ["https://www.aem.live/docs/faq", "https://www.aem.live/developer/keeping-it-100"]

- question: Is this the same thing as a headless CMS?
  expect_urls: ["https://www.aem.live/docs/faq"]

- question: What did this used to be called before it was renamed?
  expect_urls: ["https://www.aem.live/docs/faq"]

- question: What Lighthouse number should I be aiming for?
  expect_urls: ["https://www.aem.live/docs/faq", "https://www.aem.live/developer/keeping-it-100"]

- question: Which browsers will this work in?
  expect_urls: ["https://www.aem.live/docs/faq"]

